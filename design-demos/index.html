<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aniwatch — Choose Design Direction</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0c10; color: #f1f5f9; }
    iframe { width: 100%; height: calc(100vh - 128px); border: none; }
  </style>
</head>
<body class="font-sans antialiased flex flex-col h-screen overflow-hidden">

  <!-- TOP COMPARISON BAR -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center font-black text-xs">AW</div>
      <div>
        <h1 class="font-bold text-sm text-white">Aniwatch Design Direction Selector</h1>
        <p class="text-[11px] text-slate-400">3 distinct visual systems generated per the huashu-design skill • Pick one to proceed</p>
      </div>
    </div>

    <!-- Direction Tabs -->
    <div class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
      <button onclick="switchTab(1)" id="tab-1" class="px-4 py-1.5 rounded-lg font-bold bg-indigo-600 text-white shadow transition">
        Direction 1: Modern Cinematic
      </button>
      <button onclick="switchTab(2)" id="tab-2" class="px-4 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition">
        Direction 2: Tokyo Manga-Zine
      </button>
      <button onclick="switchTab(3)" id="tab-3" class="px-4 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition">
        Direction 3: Cyber-Manhwa HUD
      </button>
    </div>

    <!-- Direct Links -->
    <div class="text-xs text-slate-400 flex items-center gap-3">
      <a id="direct-link" href="dir-1.html" target="_blank" class="hover:text-indigo-400 flex items-center gap-1 font-mono">
        Open standalone ↗
      </a>
    </div>
  </header>

  <!-- SUBHEADER INFO ROW -->
  <div class="bg-slate-950/70 border-b border-slate-800/60 px-6 py-2 text-xs flex items-center justify-between font-mono text-slate-400">
    <div id="direction-summary" class="truncate">
      <span class="text-indigo-400 font-bold">DIR 1</span> • Crunchyroll/Netflix streaming feel • Soft neon depth • High density
    </div>
    <div class="hidden sm:block text-slate-500">
      Use the in-frame toggle to preview Catalog vs Reader
    </div>
  </div>

  <!-- IFRAME CONTAINER -->
  <main class="flex-1 bg-black">
    <iframe id="preview-frame" src="dir-1.html"></iframe>
  </main>

  <script>
    const directions = {
      1: {
        file: 'dir-1.html',
        summary: '<span class="text-indigo-400 font-bold">DIR 1</span> • Crunchyroll/Netflix streaming feel • Soft neon depth • Jet black #08090c • High density',
        activeClass: 'px-4 py-1.5 rounded-lg font-bold bg-indigo-600 text-white shadow transition'
      },
      2: {
        file: 'dir-2.html',
        summary: '<span class="text-rose-400 font-bold">DIR 2</span> • Tokyo Manga-Zine • Tankobon print grid • Vermilion red seal #e11d48 • Table-of-contents index',
        activeClass: 'px-4 py-1.5 rounded-lg font-bold bg-rose-600 text-white shadow transition'
      },
      3: {
        file: 'dir-3.html',
        summary: '<span class="text-cyan-400 font-bold">DIR 3</span> • Cyber-Manhwa HUD • Hunter status cockpit • Electric cyan #06b6d4 • Monospace telemetry',
        activeClass: 'px-4 py-1.5 rounded-lg font-bold bg-cyan-500 text-black shadow transition'
      }
    };

    function switchTab(num) {
      document.getElementById('preview-frame').src = directions[num].file;
      document.getElementById('direct-link').href = directions[num].file;
      document.getElementById('direction-summary').innerHTML = directions[num].summary;

      for (let i = 1; i <= 3; i++) {
        const tab = document.getElementById('tab-' + i);
        if (i === num) {
          tab.className = directions[i].activeClass;
        } else {
          tab.className = 'px-4 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition';
        }
      }
    }
  </script>
</body>
</html>
